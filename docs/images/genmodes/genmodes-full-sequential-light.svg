</g>
<g class="st st4">
<text x="188" y="134" class="t t-llm t-badge" >LLM call</text>
</g>
<g class="st st4">
<rect x="146" y="146" width="84" height="58" rx="6" class="b-pair"/>
<line x1="146" y1="175" x2="230" y2="175" class="divider"/>
<text x="188" y="166" class="t t-user" >user</text>
<text x="188" y="195" class="t" >assistant</text>
<text x="142" y="150" class="t t-note t-badge" style="text-anchor:start">#2</text>
</g>
<g class="st st6">
<path d="M312 117V146" class="ln" marker-end="url(#m-ink)"/>
</g>
<g class="st st5">
<rect x="268" y="79" width="88" height="38" rx="6" class="b-prompt"/>
<text x="312" y="94.8" class="t t-sm t-prompt" >Later gen.</text>
<text x="312" y="110.8" class="t t-sm t-prompt" >prompt</text>
</g>
<g class="st st6">
<text x="312" y="134" class="t t-llm t-badge" >LLM call</text>
</g>
<g class="st st6">
<rect x="270" y="146" width="84" height="58" rx="6" class="b-pair"/>
<line x1="270" y1="175" x2="354" y2="175" class="divider"/>
<text x="312" y="166" class="t t-user" >user</text>
<text x="312" y="195" class="t" >assistant</text>
<text x="266" y="150" class="t t-note t-badge" style="text-anchor:start">#3</text>
</g>
<g class="st st3">
<path d="M108 90H144" class="ln" marker-end="url(#m-ink)"/>
</g>
<g class="st st5">
<path d="M232 90H268" class="ln" marker-end="url(#m-ink)"/>
