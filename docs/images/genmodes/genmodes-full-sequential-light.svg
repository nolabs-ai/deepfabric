<text x="64" y="166" class="t t-user" >user</text>
<text x="64" y="195" class="t" >assistant</text>
<text x="18" y="150" class="t t-note t-badge" style="text-anchor:start">#1</text>
</g>
<g class="st st4">
<path d="M188 117V146" class="ln" marker-end="url(#m-ink)"/>
</g>
