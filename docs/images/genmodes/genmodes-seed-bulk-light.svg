<rect x="284" y="173" width="56" height="32" rx="6" class="b-seed"/>
<text x="312" y="194.4" class="t t-user" >user</text>
<path d="M64 133V173" class="ln" marker-end="url(#m-ink)"/>
<path d="M64 133L174.14521168564207 148.9888210511416Q188 151 188 165V173" class="ln" marker-end="url(#m-ink)"/>
<path d="M64 133L298.03673059270875 149.9865368978579Q312 151 312 165V173" class="ln" marker-end="url(#m-ink)"/>
<rect x="31" y="122" width="66" height="20" rx="4" class="lblbg"/>
<text x="64" y="138" class="t t-llm" >LLM call</text>
<text x="374" y="195" class="t t-more" >…</text>
</g>
<g class="st st3">
<g class="st st3">
<path d="M64 205V212" class="ln" />
</g>
<g class="st st3">
<path d="M64 250V279" class="ln" marker-end="url(#m-ink)"/>
</g>
<g class="st st3">
<rect x="20" y="212" width="88" height="38" rx="6" class="b-comp"/>
<text x="64" y="227.8" class="t t-sm t-comp" >Completion</text>
<text x="64" y="243.8" class="t t-sm t-comp" >prompt</text>
</g>
<g class="st st3">
<text x="64" y="267" class="t t-llm t-badge" >LLM call</text>
</g>
<rect x="22" y="279" width="84" height="58" rx="6" class="b-pair"/>
