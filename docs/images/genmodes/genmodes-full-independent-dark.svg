<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 244" width="424" height="244" role="img" aria-label="full independent generation, animated">
<style>
:root { --bg: #15171c; --surface: #1d2028; --ink: #e5e8ef; --muted: #9aa2b1; --frame: #4b5263; --grid: #2b2f39; --prompt: #93abf2; --prompt-bg: #1d2742; --user: #f48fb1; --pair-bg: #2b1c25; --comp: #86c98a; --comp-bg: #1a2b1e; --hist: #ffa94d; --seed: #d9a86c; font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.t { fill: var(--ink); font-size: 16px; text-anchor: middle; font-family: inherit; }
.t-sm { font-size: 14px; }
.t-user { fill: var(--user); }
.t-comp { fill: var(--comp); }
.t-prompt { fill: var(--prompt); }
.t-llm { fill: var(--muted); font-size: 15px; font-style: italic; }
.t-note { fill: var(--muted); font-size: 14px; }
.t-badge { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.t-na { fill: var(--muted); font-size: 20px; }
.t-cap { font-size: 14px; }
.t-cap.hist { fill: var(--hist); }
.t-cap.seed { fill: var(--seed); }
.t-head { fill: var(--ink); font-size: 21px; font-weight: 600; text-anchor: middle; }
.b-topic { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.b-prompt { fill: var(--prompt-bg); stroke: var(--prompt); stroke-width: 1; }
.b-comp { fill: var(--comp-bg); stroke: var(--comp); stroke-width: 1; }
.b-pair { fill: var(--pair-bg); stroke: var(--user); stroke-width: 1.5; }
.b-seed { fill: var(--surface); stroke: var(--user); stroke-width: 1.5; stroke-dasharray: 4 3; }
.divider { stroke: var(--user); stroke-opacity: 0.45; }
.hl { fill: none; stroke: var(--hist); stroke-width: 2.4; }
.ln { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.tether { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
.bus { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.bus.hist { stroke: var(--hist); }
.bus.seed { stroke: var(--seed); }
.halo { fill: none; stroke: var(--bg); stroke-width: 9; }
.dot.hist { fill: var(--hist); }
.dot.seed { fill: var(--seed); }
.mk-ink { fill: var(--ink); }
.mk-hist { fill: var(--hist); }
.mk-seed { fill: var(--seed); }
.grp { fill: var(--bg); stroke: var(--frame); stroke-width: 1.2; stroke-dasharray: 5 4; }
.grid { stroke: var(--grid); stroke-width: 1.5; }
.fade { opacity: 0.7; stroke-dasharray: 3 4; }
.lblbg { fill: var(--bg); }
.t-more { fill: var(--muted); font-size: 22px; font-weight: 600; }
@keyframes a1 { 0%, 0.01% { opacity: 1; } 3.13%, 96.88% { opacity: 1; } 100% { opacity: 1; } }
.st1 { animation: a1 11.2s linear infinite; }
@keyframes a2 { 0%, 14.29% { opacity: 0.06; } 17.41%, 96.88% { opacity: 1; } 100% { opacity: 0.06; } }
.st2 { animation: a2 11.2s linear infinite; }
@keyframes a3 { 0%, 28.57% { opacity: 0.06; } 31.70%, 96.88% { opacity: 1; } 100% { opacity: 0.06; } }
.st3 { animation: a3 11.2s linear infinite; }
@keyframes a4 { 0%, 42.86% { opacity: 0.06; } 45.98%, 96.88% { opacity: 1; } 100% { opacity: 0.06; } }
.st4 { animation: a4 11.2s linear infinite; }
@keyframes a5 { 0%, 57.14% { opacity: 0.06; } 60.27%, 96.88% { opacity: 1; } 100% { opacity: 0.06; } }
.st5 { animation: a5 11.2s linear infinite; }

@media (prefers-reduced-motion: reduce) { .st { animation: none !important; opacity: 1 !important; } }
</style>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-ink"/></marker><marker id="m-hist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-hist"/></marker><marker id="m-seed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-seed"/></marker></defs>
<rect width="100%" height="100%" rx="8" fill="var(--bg)"/>
<g class="st st4">
<rect x="26" y="26" width="110" height="208" rx="10" class="grp"/>
</g>
<g class="st st3">
<rect x="18" y="18" width="110" height="208" rx="10" class="grp"/>
</g>
<g class="st st2">
<rect x="10" y="10" width="110" height="208" rx="10" class="grp"/>
</g>
<g class="st st1">
<rect x="28" y="22" width="72" height="44" rx="6" class="b-topic"/>
<text x="64" y="40.4" class="t" >Topic</text>
<text x="64" y="58.4" class="t" >path</text>
</g>
<g class="st st1">
<path d="M64 66V81" class="ln" />
</g>
<g class="st st2">
<path d="M64 119V148" class="ln" marker-end="url(#m-ink)"/>
</g>
<g class="st st1">
<rect x="20" y="81" width="88" height="38" rx="6" class="b-prompt"/>
<text x="64" y="96.8" class="t t-sm t-prompt" >Generation</text>
<text x="64" y="112.8" class="t t-sm t-prompt" >prompt</text>
</g>
<g class="st st2">
<text x="64" y="136" class="t t-llm t-badge" >LLM call</text>
</g>
<g class="st st2">
<rect x="22" y="148" width="84" height="58" rx="6" class="b-pair"/>
<line x1="22" y1="177" x2="106" y2="177" class="divider"/>
<text x="64" y="168" class="t t-user" >user</text>
<text x="64" y="197" class="t" >assistant</text>
</g>
<g class="st st5">
<text x="142" y="44" class="t t-note" style="text-anchor:start">× N independent calls</text>
</g>
</svg>
